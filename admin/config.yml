backend:
  name: git-gateway
  branch: main

media_folder: "uploads"
public_folder: "/uploads"

collections:
  - name: "devotionals"
    label: "Devotionals"
    files:
      - name: "devotionals"
        label: "Devotionals List"
        file: "content/devotionals.json"
        fields:
          - { label: "Devotionals", name: "devotionals", widget: "list", fields: [
              { label: "Date", name: "date", widget: "string" },
              { label: "Title", name: "title", widget: "string" },
              { label: "Body", name: "body", widget: "text" }
            ]}

  - name: "sermons"
    label: "Sermons"
    files:
      - name: "sermons"
        label: "Sermons List"
        file: "content/sermons.json"
        fields:
          - { label: "Sermons", name: "sermons", widget: "list", fields: [
              { label: "Title", name: "title", widget: "string" },
              { label: "Description", name: "description", widget: "string" },
              { label: "Tag", name: "tag", widget: "string", hint: "e.g. Sunday Service, Bible Study, Sunday School" },
              { label: "Telegram Link", name: "telegram_link", widget: "string", required: false, hint: "Paste the Telegram link where people can get this sermon's audio" }
            ]}

  - name: "events"
    label: "Events"
    files:
      - name: "events"
        label: "Events List"
        file: "content/events.json"
        fields:
          - { label: "Events", name: "events", widget: "list", fields: [
              { label: "Day (e.g. 27)", name: "day", widget: "string" },
              { label: "Month (e.g. Jul)", name: "month", widget: "string" },
              { label: "Title", name: "title", widget: "string" },
              { label: "Description", name: "description", widget: "string" },
              { label: "Time (e.g. 9:00 AM)", name: "time", widget: "string" }
            ]}

  - name: "about"
    label: "About Page"
    files:
      - name: "about"
        label: "About Content"
        file: "content/about.json"
        fields:
          - { label: "About", name: "about", widget: "object", fields: [
              { label: "Body text", name: "body", widget: "text" },
              { label: "Email", name: "email", widget: "string" },
              { label: "Address", name: "address", widget: "string" },
              { label: "Sunday Worship time", name: "sunday_worship", widget: "string" },
              { label: "Sunday School time", name: "sunday_school", widget: "string" },
              { label: "Bible Study time", name: "bible_study", widget: "string" },
              { label: "Prayer Meeting time", name: "prayer_meeting", widget: "string" }
            ]}

  - name: "gallery"
    label: "Photo Gallery"
    files:
      - name: "gallery"
        label: "Gallery Photos"
        file: "content/gallery.json"
        fields:
          - { label: "Photos", name: "gallery", widget: "list", fields: [
              { label: "Caption", name: "caption", widget: "string" },
              { label: "Image", name: "image", widget: "image", required: false }
            ]}
